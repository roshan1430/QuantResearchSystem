[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantresearchsystem"
version = "0.2.0"
description = "Research-grade quantitative research platform for market regime detection and adaptive machine learning strategies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "QuantResearchSystem Contributors" }
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.4,<2.0",
  "scipy>=1.12,<2.0",
  "statsmodels>=0.14,<0.15",
  "plotly>=5.22,<6.0",
  "matplotlib>=3.8,<4.0",
  "PyYAML>=6.0,<7.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "typing-extensions>=4.10,<5.0"
]

[project.optional-dependencies]
data = [
  "yfinance>=0.2.40,<0.3.0"
]
tree = [
  "xgboost>=2.1,<3.0"
]
deep = [
  "torch>=2.3,<3.0"
]
rl = [
  "stable-baselines3>=2.3,<3.0",
  "gymnasium>=0.29,<1.0"
]
tracking = [
  "mlflow>=2.14,<3.0"
]
explainability = [
  "shap>=0.45,<0.46"
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<0.6"
]
full = [
  "yfinance>=0.2.40,<0.3.0",
  "xgboost>=2.1,<3.0",
  "torch>=2.3,<3.0",
  "stable-baselines3>=2.3,<3.0",
  "gymnasium>=0.29,<1.0",
  "mlflow>=2.14,<3.0",
  "shap>=0.45,<0.46",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<0.6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
