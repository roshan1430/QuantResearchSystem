name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install ML engine dependencies
        run: pip install -r ml-engine/requirements.txt
      - name: Validate backend imports
        run: python -c "import sys; sys.path.append('backend'); import app.main"
      - name: Validate ML engine imports
        run: python -c "import sys; sys.path.append('ml-engine'); import engine.main"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
